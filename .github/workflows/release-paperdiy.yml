name: release-paperdiy

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release version
        run: python3 scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO core + build
        uses: actions/cache@v6
        with:
          path: |
            .platformio-core
            .pio
          key: paperdiy-release-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            paperdiy-release-${{ hashFiles('platformio.ini') }}-

      - name: Build
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio-core
          PLATFORMIO_BUILD_FLAGS: -DCROSSPOINT_OTA_RELEASES_URL=\"https://api.github.com/repos/${{ github.repository }}/releases/latest\"
        run: pio run -e paperdiy

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp .pio/build/paperdiy/firmware.bin "dist/crosspoint-${GITHUB_REF_NAME}-paperdiy.bin"
          cp .pio/build/paperdiy/firmware.bin dist/firmware.bin
          cp .pio/build/paperdiy/firmware.factory.bin dist/firmware.factory.bin
          python3 scripts/make_launcher_package.py --version "${GITHUB_REF_NAME#v}" --output-dir dist/launcher
          cp dist/launcher/*.bin dist/
          cp dist/launcher/README.md dist/launcher-README.md
          (cd dist && sha256sum *.bin *.md > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/*.md
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
