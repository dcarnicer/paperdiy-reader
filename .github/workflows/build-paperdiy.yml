name: build-paperdiy

on:
  push:
    branches:
      - paperdiy
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO core + build
        uses: actions/cache@v4
        with:
          path: |
            .platformio-core
            .pio
          key: paperdiy-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            paperdiy-${{ hashFiles('platformio.ini') }}-

      - name: Build
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio-core
        run: pio run -e paperdiy

      - name: Package M5Launcher image
        run: python3 scripts/make_launcher_package.py --version ci

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: paperdiy-firmware
          path: |
            .pio/build/paperdiy/firmware.bin
            .pio/build/paperdiy/firmware.factory.bin
            dist/launcher/PaperDIYReader-*-launcher.bin
            dist/launcher/README.md
          if-no-files-found: error
