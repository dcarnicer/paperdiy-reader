name: build-paperdiy

on:
  push:
    branches:
      - paperdiy
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO core + build
        uses: actions/cache@v6
        with:
          path: |
            .platformio-core
            .pio
          key: paperdiy-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            paperdiy-${{ hashFiles('platformio.ini') }}-

      - name: Build
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio-core
        # Both boards in one invocation: a second `pio run` sees the files the
        # first generated (i18n, HTML), changes the project checksum and wipes
        # .pio/build, deleting the first board's images. ws397 shares
        # BoardConfig.h, main.cpp and the themes, so a sync can break it alone.
        run: pio run -e paperdiy -e ws397

      - name: Check release images
        run: |
          for board in paperdiy ws397; do
            python3 scripts/check_release_assets.py --board "${board}" \
              ".pio/build/${board}/firmware.factory.bin" ".pio/build/${board}/firmware.bin"
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: paperdiy-firmware
          path: |
            .pio/build/paperdiy/firmware.bin
            .pio/build/paperdiy/firmware.factory.bin
          if-no-files-found: error
